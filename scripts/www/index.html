<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f172a" />
<title>今日清单</title>
<style>
  :root {
    --bg1: #1e293b;
    --bg2: #0f172a;
    --card: rgba(255, 255, 255, 0.08);
    --accent: #38bdf8;
    --accent2: #818cf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --done: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { text-align: center; padding: 28px 0 12px; }
  header .date { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  header h1 { margin: 6px 0 0; font-size: 26px; font-weight: 700; }
  header .quote { margin-top: 10px; font-size: 13px; color: var(--accent); min-height: 18px; }
  .input-row { display: flex; gap: 8px; margin: 14px 0; }
  #task {
    flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,0.12);
    color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none;
  }
  #task::placeholder { color: var(--muted); }
  #add {
    border: none; border-radius: 12px; padding: 0 18px; font-size: 15px; font-weight: 600;
    color: #0b1220; background: linear-gradient(135deg, var(--accent), var(--accent2)); cursor: pointer;
  }
  .stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 4px 2px 10px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  li .check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted);
    flex: 0 0 auto; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent;
  }
  li.done .check { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  li .txt { flex: 1; font-size: 15px; word-break: break-word; }
  li.done .txt { color: var(--done); text-decoration: line-through; }
  li .del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="date"></div>
    <h1>今日清单</h1>
    <div class="quote" id="quote"></div>
  </header>

  <div class="input-row">
    <input id="task" type="text" placeholder="写点什么…" maxlength="120" />
    <button id="add">添加</button>
  </div>

  <div class="stats">
    <span id="count">共 0 项</span>
    <span id="left">待办 0</span>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty">还没有任务，加一条吧 ✦</div>

  <footer>本地保存 · 离线可用 · PakePlus 打包 demo</footer>
</div>

<script>
  const KEY = "pakeplus_todos_v1";
  const quotes = [
    "种一棵树最好的时间是十年前，其次是现在。",
    "完成胜于完美。",
    "今天的清单，今天清空。",
    "小步快跑，持续向前。",
    "专注做一件事，胜过分心做十件。"
  ];
  const $ = (s) => document.querySelector(s);
  let todos = [];

  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }

  function save() { localStorage.setItem(KEY, JSON.stringify(todos)); }
  function render() {
    const list = $("#list");
    list.innerHTML = "";
    todos.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      li.innerHTML = `<div class="check">✓</div><div class="txt"></div><button class="del">×</button>`;
      li.querySelector(".txt").textContent = t.text;
      li.querySelector(".check").onclick = () => { todos[i].done = !todos[i].done; save(); render(); };
      li.querySelector(".del").onclick = () => { todos.splice(i, 1); save(); render(); };
      list.appendChild(li);
    });
    const done = todos.filter(t => t.done).length;
    $("#count").textContent = `共 ${todos.length} 项`;
    $("#left").textContent = `待办 ${todos.length - done}`;
    $("#empty").style.display = todos.length ? "none" : "block";
  }
  function add() {
    const v = $("#task").value.trim();
    if (!v) return;
    todos.unshift({ text: v, done: false });
    $("#task").value = "";
    save(); render();
  }
  $("#add").onclick = add;
  $("#task").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });

  $("#date").textContent = new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  $("#quote").textContent = quotes[Math.floor(Math.random() * quotes.length)];
  render();
</script>
</body>
</html>
